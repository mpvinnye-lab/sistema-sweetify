name: Generate Sweetify icons

on:
  push:
    paths:
      - ".icon-src/**"
      - ".github/workflows/generate-sweetify-icons.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install image tooling
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick

      - name: Build Sweetify icons
        shell: bash
        run: |
          set -euo pipefail
          cat .icon-src/part-*.txt > /tmp/sweetify-icon.b64
          base64 -d /tmp/sweetify-icon.b64 > /tmp/icon-192.png
          file /tmp/icon-192.png
          cp /tmp/icon-192.png icons/icon-192.png

          if command -v magick >/dev/null 2>&1; then
            magick /tmp/icon-192.png -resize 180x180 icons/apple-touch-icon.png
            magick /tmp/icon-192.png -resize 512x512 icons/icon-512.png
          elif command -v convert >/dev/null 2>&1; then
            convert /tmp/icon-192.png -resize 180x180 icons/apple-touch-icon.png
            convert /tmp/icon-192.png -resize 512x512 icons/icon-512.png
          else
            cp /tmp/icon-192.png icons/apple-touch-icon.png
            cp /tmp/icon-192.png icons/icon-512.png
          fi

          file icons/apple-touch-icon.png icons/icon-192.png icons/icon-512.png

      - name: Commit generated icons
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add icons
          if git diff --cached --quiet; then
            echo "No icon changes."
            exit 0
          fi
          git commit -m "Sweetify Caixa v8.1: gera ícones a partir da nova logo"
          git push
